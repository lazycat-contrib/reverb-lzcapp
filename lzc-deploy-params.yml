# 安装参数：Reverb 管理员密码（首次启动种子，登录页自动填充实现免密）
params:
  - id: admin_password
    type: secret
    name: "Admin Password"
    description: "Password for the built-in admin account (seeded on first start, auto-generated)"
    default_value: "$random(len=20)"
    optional: true

locales:
  zh:
    admin_password:
      name: "管理员密码"
      description: "内置 admin 账号的密码（首次启动时写入，默认随机生成）"
  zh_CN:
    admin_password:
      name: "管理员密码"
      description: "内置 admin 账号的密码（首次启动时写入，默认随机生成）"
  en:
    admin_password:
      name: "Admin Password"
      description: "Password for the built-in admin account (seeded on first start, auto-generated)"
