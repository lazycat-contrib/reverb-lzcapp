package: community.lazycat.app.reverb
version: 0.4.0
name: Reverb
description: "Self-hosted music app: browse your own library and an online catalog in one place, see what you already have, download missing tracks in one click, and play everything in a built-in web player with synced lyrics and radio mixes (AGPL-3.0)."
min_os_version: 1.6.0
homepage: https://github.com/maxjb-xyz/reverb
author: maxjb-xyz
license: AGPL-3.0
locales:
  zh:
    name: "Reverb"
    description: "自托管音乐应用：一个界面同时浏览已有音乐库与在线曲库，标出你缺的曲目，一键下载进自己的曲库，内置播放器支持同步歌词与电台推荐（AGPL-3.0）。"
  zh_CN:
    name: "Reverb"
    description: "自托管音乐应用：一个界面同时浏览已有音乐库与在线曲库，标出你缺的曲目，一键下载进自己的曲库，内置播放器支持同步歌词与电台推荐（AGPL-3.0）。"
  en:
    name: "Reverb"
    description: "Self-hosted music app: browse your own library and an online catalog in one place, see what you already have, download missing tracks in one click, and play everything in a built-in web player with synced lyrics and radio mixes (AGPL-3.0)."
permissions:
  required:
    - net.internet
    - net.lan
